services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffee_dev_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - coffee_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3001
      APP_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://coffee:${POSTGRES_PASSWORD:-coffee_dev_only}@db:5432/coffee
      FORECAST_SERVICE_URL: http://forecast:8001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node dist/migrate.js && node dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
  forecast:
    build: ./forecast-service
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
  forecast-worker:
    build: .
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://coffee:${POSTGRES_PASSWORD:-coffee_dev_only}@db:5432/coffee
      FORECAST_SERVICE_URL: http://forecast:8001
    depends_on:
      api:
        condition: service_healthy
      forecast:
        condition: service_healthy
    command: ["node", "dist/forecast-worker.js"]
volumes:
  coffee_pg:
